services:
  app:
    build: .
    container_name: sit725-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/sit725-group-88
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: sit725-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: